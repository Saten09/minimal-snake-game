<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Snake">
<meta name="description" content="A minimal mobile snake game. Swipe to play.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Snake — Minimal Arcade</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#292929;--line:#444;--cream:#e9e9df;--ink:#263b30;--orange:#c47b3c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f5f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.app{width:min(100%,560px);margin:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:900;letter-spacing:-1.5px}.dot{color:var(--orange)}.subtitle{font-size:14px;color:#999;margin-top:2px}.edition{font-size:11px;letter-spacing:2px;color:#999}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px}.stat-label{font-size:12px;letter-spacing:1px;color:#aaa}.stat-value{font-size:29px;font-weight:800;margin-top:3px}
.board-wrap{position:relative;width:100%;aspect-ratio:1;background:var(--cream);border-radius:22px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(233,233,223,.94);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay.hidden{display:none}.overlay h1{font-size:clamp(30px,8vw,42px);letter-spacing:-1.5px;margin:0}.overlay p{font-size:15px;color:#6d746b;margin:8px 0 24px}
button,select{font:inherit}button{border:0;border-radius:13px;padding:14px 18px;font-weight:750;cursor:pointer;min-height:48px}.primary{background:var(--ink);color:white;min-width:150px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:var(--panel);color:#f5f5f5;border:1px solid var(--line)}.hint{text-align:center;font-size:14px;font-weight:600}.keys{text-align:center;color:#888;font-size:13px}.settings{display:flex;justify-content:center;align-items:center;gap:10px;color:#aaa;font-size:13px}select{background:var(--panel);color:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
</style></head><body><main class="app">
<header><div><div class="brand">SNAKE<span class="dot">.</span></div><div class="subtitle">Minimal mobile arcade</div></div><div class="edition">01 / CLASSIC</div></header>
<section class="stats"><div class="stat"><div class="stat-label">SCORE</div><div class="stat-value" id="score">0</div></div><div class="stat"><div class="stat-label">BEST</div><div class="stat-value" id="best">0</div></div><div class="stat"><div class="stat-label">SPEED</div><div class="stat-value" id="speed-label" style="font-size:22px">SLOW</div></div></section>
<section class="board-wrap"><canvas id="game" width="400" height="400" aria-label="Swipe here to control the snake"></canvas><div class="overlay" id="overlay"><h1 id="overlay-title">SNAKE.</h1><p id="overlay-text">Swipe to move. Collect dots. Avoid the walls.</p><button class="primary" id="overlay-button">Start playing</button></div></section>
<section class="actions"><button class="secondary" id="pause">Pause</button><button class="secondary" id="restart">Restart</button></section>
<div class="hint">Swipe anywhere on the board to steer</div><div class="keys">↑ ↓ ← → &nbsp;·&nbsp; Touch &amp; slide</div>
<div class="settings"><label for="speed">Speed</label><select id="speed"><option value="250">Very slow</option><option value="200" selected>Slow</option><option value="150">Normal</option></select></div>
</main><script src="./game.js"></script><script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script></body></html>
